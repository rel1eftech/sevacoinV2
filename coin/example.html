<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEVA Coin Component</title>
  <!-- 1. the component's styles -->
  <link rel="stylesheet" href="../assets/coin/seva-coin.css">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 40px; padding: 40px 16px; background: #071526; font-family: system-ui, sans-serif; color: #eef3f8; }
    .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 40px; }
  </style>
</head>
<body>
  <!-- 2. place a coin anywhere -->
  <div class="seva-coin" data-seva-coin data-controls></div>

  <div class="row">
    <div class="seva-coin" data-seva-coin style="--coin-size: 140px"></div>               <!-- smaller, no buttons -->
    <div class="seva-coin" data-seva-coin data-variant="b" style="--coin-size: 140px"></div> <!-- option B for this one -->
    <div class="seva-coin" data-seva-coin data-static style="--coin-size: 48px"></div>      <!-- still icon -->
  </div>

  <!-- 3. the script (renders every [data-seva-coin]; call SevaCoin.mountAll() after adding coins later) -->
  <script src="../assets/coin/seva-coin.js"></script>
</body>
</html>
